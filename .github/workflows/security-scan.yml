name: Security Scanning & Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly security scan

permissions:
  contents: read
  security-events: write

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check for vulnerable dependencies
        run: |
          pip install -r requirements.txt
          safety check --json || true

      - name: Bandit security analysis
        run: |
          bandit -r Bad_USB_Classifier/ -f json -o bandit-report.json || true
          bandit -r Bad_USB_Classifier/

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort

      - name: Check code formatting
        run: |
          black --check Bad_USB_Classifier/ || true
          isort --check-only Bad_USB_Classifier/ || true

      - name: Lint with pylint
        run: |
          pylint Bad_USB_Classifier/ --exit-zero
        continue-on-error: true

      - name: Lint with flake8
        run: |
          flake8 Bad_USB_Classifier/ --count --select=E9,F63,F7,F82 --show-source --statistics

  creds-scan:
    name: Credentials & Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for exposed credentials
        run: |
          # Check for common credential patterns
          ! grep -r "password\s*=" . --include="*.py" || echo "Warning: possible hardcoded passwords"
          ! grep -r "api_key\s*=" . --include="*.py" || echo "Warning: possible API keys"
          ! grep -r "secret\s*=" . --include="*.py" || echo "Warning: possible secrets"
          ! grep -r "token\s*=" . --include="*.py" || echo "Warning: possible tokens"
        continue-on-error: true

  results:
    name: Security Scan Results
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-check, codeql-analysis, lint-and-format, creds-scan]
    if: always()
    steps:
      - name: Check scan results
        run: |
          echo "✓ Security scanning complete"
          echo "Review results in the Actions tab"
