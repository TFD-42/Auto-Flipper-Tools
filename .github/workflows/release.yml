name: Release

# Déclenché par un tag de version (ex: v1.1.0). Ordre strict:
#   1. test  — pytest + import check sur ubuntu/macos/windows (réutilise la
#      même logique que tests.yml — si ça casse, rien d'autre ne se lance).
#   2. build-package — sdist + wheel Python (pip install .), un seul job
#      (pur Python, pas besoin de matrix OS).
#   3. build-executables — binaire autonome PyInstaller par OS (matrix),
#      ne démarre qu'après que les tests soient verts sur les 3 OS.
#   4. publish — crée la GitHub Release et attache tous les artefacts,
#      seulement si tout ce qui précède a réussi.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install & test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

  build-package:
    name: Build sdist/wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel installs and runs
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install dist/*.whl
          /tmp/verify-venv/bin/badusb-pipeline --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  build-executables:
    name: Build executable (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: badusb-pipeline-linux
          - os: macos-latest
            asset_name: badusb-pipeline-macos
          - os: windows-latest
            asset_name: badusb-pipeline-windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone executable
        run: |
          pyinstaller --onefile --name badusb-pipeline --paths . badusb_pipeline.py
      - name: Verify executable runs
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/badusb-pipeline.exe --help
          else
            ./dist/badusb-pipeline --help
          fi
      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/badusb-pipeline.exe "out/${{ matrix.asset_name }}"
          else
            cp dist/badusb-pipeline "out/${{ matrix.asset_name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  publish:
    name: Publish GitHub Release
    needs: [build-package, build-executables]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
